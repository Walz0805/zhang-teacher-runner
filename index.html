<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>张老师快跑</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="mobile-controls.css" />
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div>
        <h1>张老师快跑</h1>
        <p>巧乐兹要跳，雪碧要蹲，土木学生和砖头也要跳，分数越高速度越快。</p>
      </div>
      <button id="restartBtn" type="button">重新开始</button>
    </header>

    <section class="stage-wrap" id="stageWrap">
      <canvas id="gameCanvas" width="960" height="540" aria-label="张老师快跑游戏画布"></canvas>

      <div id="startPanel" class="panel start-panel">
        <img class="title-logo" src="assets/images/title_logo.png" alt="张老师快跑" />
        <p class="start-desc">张老师出发了！巧乐兹要跳，雪碧要蹲，长按屏幕还能加速；碰到紫色嘴唇可获得 <b>5 秒无敌</b>！</p>
        <div class="feature-badges">
          <span>空格 / ↑ / W 跳跃</span>
          <span>↓ / S 下蹲</span>
          <span>Shift / 长按画面 加速</span>
          <span>紫色嘴唇 = 5s 无敌</span>
        </div>
        <p class="note">音频文件：<code>assets/audio/1.mp3</code> 背景音乐，<code>2.mp3</code> 失败结束语 / 加速开始语音。手机端会自动模拟横屏显示，按钮会贴在横屏画面的左右两侧。</p>
        <button id="startBtn" type="button" class="primary-btn">开始游戏</button>
      </div>

      <div id="gameOverPanel" class="panel game-over-panel hidden">
        <div class="game-over-burst">GAME OVER</div>
        <h2>游戏结束</h2>
        <p id="finalScore">分数：0</p>
        <p class="note">老师摔了一跤，休息一下再冲更高分吧！</p>
        <button id="againBtn" type="button" class="primary-btn">再跑一次</button>
      </div>
    </section>

    <section class="mobile-controls controls-hidden" id="mobileControls" aria-label="移动端操作按钮">
      <button id="boostBtn" type="button" class="mc-btn mc-btn-boost">
        <span class="mc-btn-sub">HOLD</span>
        <span class="mc-btn-main">加速</span>
      </button>

      <div class="mc-right-stack">
        <button id="jumpBtn" type="button" class="mc-btn mc-btn-jump">
          <span class="mc-btn-sub">TAP</span>
          <span class="mc-btn-main">跳跃</span>
        </button>
        <button id="duckBtn" type="button" class="mc-btn mc-btn-duck">
          <span class="mc-btn-sub">HOLD</span>
          <span class="mc-btn-main">下蹲</span>
        </button>
      </div>
    </section>
  </main>

  <audio id="bgm" src="assets/audio/1.mp3" loop preload="auto"></audio>
  <audio id="failAudio" src="assets/audio/2.mp3" preload="auto"></audio>
  <audio id="boostAudio" src="assets/audio/2.mp3" preload="auto"></audio>

  <script src="game.js"></script>
</body>
</html>
